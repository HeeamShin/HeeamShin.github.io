<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script>
    // 저장된 테마를 그리기 전에 적용해 깜빡임을 막는다. 저장값이 없으면 시스템 설정을 따른다.
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  {% assign books = site.pages | where_exp: "p", "p.path contains 'docs/books/'" | sort: "title" %}
  <nav class="navbar has-burger-menu" aria-label="사이트 메뉴">
    <div class="container is-max-desktop">
      <div class="navbar-brand">
        <a class="navbar-item has-text-weight-bold" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <div class="navbar-tools">
          <a class="navbar-item navbar-icon" href="https://github.com/HeeamShin/HeeamShin.github.io" aria-label="GitHub 저장소" title="GitHub 저장소">
            <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
          <button type="button" class="navbar-item navbar-icon theme-toggle" aria-label="다크 모드로 전환" title="다크 모드로 전환">
            <svg class="theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
        </div>
        <button type="button" class="navbar-burger" aria-label="글 목록" aria-expanded="false" aria-controls="site-menu">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <div class="navbar-menu" id="site-menu">
      <div class="container is-max-desktop">
        <p class="menu-label">독서 노트</p>
        {% for book in books %}
        <a class="navbar-item" href="{{ book.url | relative_url }}">{{ book.title }}</a>
        {% endfor %}
        <hr class="navbar-divider">
        <a class="navbar-item" href="{{ '/docs/' | relative_url }}">전체 글 목록</a>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container is-max-desktop">
      <article class="content">
        {{ content }}
      </article>
    </div>
  </main>

  <footer class="footer">
    <div class="content has-text-centered is-small">
      <p>© {{ site.time | date: '%Y' }} HeeamShin · <a href="https://github.com/HeeamShin/HeeamShin.github.io">GitHub</a></p>
    </div>
  </footer>

  <script>
    // 버거 버튼으로 글 목록 메뉴를 열고 닫는다 (Bulma는 JS를 포함하지 않는다)
    (function () {
      var burger = document.querySelector('.navbar-burger');
      var menu = document.getElementById('site-menu');
      function setOpen(open) {
        burger.classList.toggle('is-active', open);
        menu.classList.toggle('is-active', open);
        burger.setAttribute('aria-expanded', String(open));
      }
      burger.addEventListener('click', function () {
        setOpen(!menu.classList.contains('is-active'));
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();

    // 다크/라이트 모드 전환. Bulma 1.0은 <html data-theme="dark|light">를 따른다.
    (function () {
      var root = document.documentElement;
      var toggle = document.querySelector('.theme-toggle');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)');
      function currentTheme() {
        return root.getAttribute('data-theme') || (systemDark.matches ? 'dark' : 'light');
      }
      function updateLabel() {
        var label = currentTheme() === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환';
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
      }
      toggle.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        updateLabel();
      });
      if (systemDark.addEventListener) systemDark.addEventListener('change', updateLabel);
      updateLabel();
    })();
  </script>
</body>
</html>
